<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFill Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-title">AutoFill Pro</span>
          <span class="brand-version">v1.1</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="open-options-btn" class="icon-btn" title="Open Settings & Profiles">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Profile Selector -->
    <div class="profile-card">
      <div class="profile-meta">
        <span class="label">ACTIVE PROFILE</span>
        <select id="profile-select" class="profile-dropdown"></select>
      </div>
    </div>

    <!-- Active Site Rule Alert (if applicable) -->
    <div id="site-rule-banner" class="site-rule-banner hidden">
      <span class="rule-icon">🌐</span>
      <span id="site-rule-text">Active Rule: workday.com (10 Digits, State Code)</span>
    </div>

    <!-- Main Action Card -->
    <div class="action-card">
      <div class="status-row">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span id="page-status-text">Scanning current page...</span>
        </div>
        <span class="field-badge" id="field-count-badge">0 Fields</span>
      </div>

      <button id="autofill-btn" class="autofill-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <span>Autofill Form Now</span>
      </button>

      <div class="shortcut-tip">
        <span>Shortcut:</span> <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd>
      </div>
    </div>

    <!-- Quick Copy Drawer -->
    <div class="quick-copy-section">
      <div class="section-title">QUICK COPY</div>
      <div class="copy-grid">
        <button class="copy-chip" data-copy="phone_digits" title="Copy 10 Digits Only">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          <span>Phone (10d)</span>
        </button>

        <button class="copy-chip" data-copy="phone_fmt" title="Copy (555) 349-2810">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>Phone (Fmt)</span>
        </button>

        <button class="copy-chip" data-copy="state_code" title="Copy State Code (e.g. CA)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          </svg>
          <span>State (Code)</span>
        </button>

        <button class="copy-chip" data-copy="linkedin" title="Copy LinkedIn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76c.92 0 1.67-.75 1.67-1.67A1.67 1.67 0 0 0 6.46 5.42 1.67 1.67 0 0 0 4.79 7.09c0 .92.75 1.67 1.67 1.67m1.4 9.74V9.95H5.06v8.55h2.8z"/>
          </svg>
          <span>LinkedIn</span>
        </button>

        <button class="copy-chip" data-copy="github" title="Copy GitHub">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
          </svg>
          <span>GitHub</span>
        </button>

        <button class="copy-chip" data-copy="email" title="Copy Email">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>Email</span>
        </button>
      </div>
    </div>

    <!-- Notification / Toast Bar inside Popup -->
    <div id="popup-toast" class="popup-toast hidden"></div>

    <!-- Footer -->
    <footer class="footer">
      <button id="footer-options-link" class="footer-link">
        <span>Edit full profile & website rules</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="../utils/matcher.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
